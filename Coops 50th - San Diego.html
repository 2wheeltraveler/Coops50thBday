<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta name="robots" content="noindex,nofollow">
<title>San Diego Trip Guide</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#e3e7ee;--accent:#1a5276}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#182029;--ink:#e6ebf2;--mute:#97a3b4;--line:#2a3542;--accent:#6bb3e0}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(340px,calc(100vw - 32px))}
h1{font-size:19px;margin:0 0 4px}p{margin:0 0 14px;color:var(--mute);font-size:13.5px}
input,button{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-sizing:border-box}
button{margin-top:10px;background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0b1218}}
#err{color:#c0392b;margin:8px 0 0;font-size:13px;min-height:18px}</style></head><body>
<form id="f"><h1>San Diego Trip Guide</h1><p>Enter the passcode to continue.</p>
<input id="pw" type="password" placeholder="Passcode" autocomplete="current-password" autofocus><button>Unlock</button><div id="err"></div></form>
<script>
let D=null;
async function load(){try{const r=await fetch("guide.enc.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;D=await r.json();try{localStorage.setItem("sd-enc",JSON.stringify(D))}catch(_){}}catch(_){try{D=JSON.parse(localStorage.getItem("sd-enc"))}catch(_){}}if(!D)throw new Error("Could not load the guide. Check your connection and try again.")}
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},k,u(D.ct)));}
function show(html){const f=document.createElement("iframe");f.srcdoc=html;f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff";document.body.innerHTML="";document.body.style.display="block";document.body.appendChild(f);const r=document.createElement("button");r.textContent="\u21bb";r.setAttribute("aria-label","Refresh");r.style.cssText="position:fixed;right:12px;bottom:12px;z-index:9;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.92);color:#1a5276;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:0";r.onclick=()=>location.reload();document.body.appendChild(r);}
const err=document.getElementById("err"),pwEl=document.getElementById("pw");
async function go(pw,auto){try{await load();if(!window.crypto||!crypto.subtle)throw new Error("This browser blocks decryption here. Open the file directly in Safari or Chrome.");const h=await dec(pw);try{localStorage.setItem("sd-pw",pw)}catch(_){}show(h)}catch(e){if(!auto)err.textContent=(e&&e.name==="OperationError")?"Wrong passcode.":("Error: "+(e&&e.message||e));else try{localStorage.removeItem("sd-pw")}catch(_){}}}
function submit(){err.textContent="Checking...";go(pwEl.value.trim(),false)}
document.querySelector("button").type="button";
document.querySelector("button").addEventListener("click",submit);
pwEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();submit()});
try{const s=localStorage.getItem("sd-pw");if(s)go(s,true)}catch(_){}
</script></body></html>
