const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},k,u(D.ct)));}
function show(html){const f=document.createElement("iframe");f.srcdoc=html;f.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff";document.body.innerHTML="";document.body.style.display="block";document.body.appendChild(f);}
const err=document.getElementById("err"),pwEl=document.getElementById("pw");
async function go(pw,auto){try{if(!window.crypto||!crypto.subtle)throw new Error("This browser blocks decryption here. Open the file directly in Safari or Chrome.");const h=await dec(pw);try{localStorage.setItem("sd-pw",pw)}catch(_){}show(h)}catch(e){if(!auto)err.textContent=(e&&e.name==="OperationError")?"Wrong passcode.":("Error: "+(e&&e.message||e));else try{localStorage.removeItem("sd-pw")}catch(_){}}}
function submit(){err.textContent="Checking...";go(pwEl.value.trim(),false)}
document.querySelector("button").type="button";
document.querySelector("button").addEventListener("click",submit);
pwEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()}});
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();submit()});
