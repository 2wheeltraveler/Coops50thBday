async function dec(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.salt),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);

const err=document.getElementById("err"),pwEl=document.getElementById("pw");
async function go(pw,auto){try{if(!window.crypto||!crypto.subtle)throw new Error("This browser blocks decryption here. Open the file directly in Safari or Chrome.");const h=await dec(pw);try{localStorage.setItem("sd-pw",pw)}catch(_){}show(h)}catch(e){if(!auto)err.textContent=(e&&e.name==="OperationError")?"Wrong passcode.":("Error: "+(e&&e.message||e));else try{localStorage.removeItem("sd-pw")}catch(_){}}}
